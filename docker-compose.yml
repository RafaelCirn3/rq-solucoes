services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rq_solucoes}
      POSTGRES_USER: ${POSTGRES_USER:-rq_solucoes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rq_solucoes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rq_solucoes} -d ${POSTGRES_DB:-rq_solucoes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rq_solucoes}
      POSTGRES_USER: ${POSTGRES_USER:-rq_solucoes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rq_solucoes}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"

volumes:
  postgres_data:
